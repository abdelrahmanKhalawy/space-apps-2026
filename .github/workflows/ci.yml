name: CI

# Every pull request and every push to main: build the screens, run the Node suites,
# build the server and run the C# tests (which start the whole app in memory).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build api/SpaceApi.csproj -c Release
      - run: dotnet test tests/SpaceApi.Tests/SpaceApi.Tests.csproj

  trial:
    # The virtual crew trial must reproduce the numbers checked into the repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I ai/trial.py --n 1000 --out "$RUNNER_TEMP/trial.json"
      - run: |
          python -I - <<'PY'
          import json, os
          new = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "trial.json")))
          old = json.load(open("data/trial/results.json"))
          assert new["detectors"] == old["detectors"], "ai/trial.py no longer reproduces data/trial/results.json: re-run it and commit the new file"
          print("trial reproduces the checked-in results")
          PY
